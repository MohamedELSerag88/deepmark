services:
  app:
    build:
      context: .
      target: app
    image: deepmark-php:latest
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    volumes:
      - ./:/var/www/html
    restart: unless-stopped

  web:
    build:
      context: .
      target: nginx
    image: deepmark-nginx:latest
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html:ro
    restart: unless-stopped

