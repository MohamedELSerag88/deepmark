services:
  app:
    build:
      context: .
      target: app
    image: deepmark-php:latest
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: deepmark
      DB_USERNAME: deepmark
      DB_PASSWORD: fdsf.&KJGHdskdjf
    volumes:
      - ./:/var/www/html
      - vendor:/var/www/html/vendor
    restart: unless-stopped
    depends_on:
      - mysql

  web:
    build:
      context: .
      target: nginx
    image: deepmark-nginx:latest
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html:ro
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: deepmark
      MYSQL_USER: deepmark
      MYSQL_PASSWORD: fdsf.&KJGHdskdjf
      MYSQL_ROOT_PASSWORD: fdsf.&KJGHdskdjf
    volumes:
      - mysql:/var/lib/mysql
    ports:
      - "3307:3306"
    restart: unless-stopped

volumes:
  vendor:
  mysql: